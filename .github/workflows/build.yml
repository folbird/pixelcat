name: Build Desktop Pet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 注意：不使用 dtolnay/rust-toolchain action——它近期被 GitHub codeload 限流(429)，
      # 导致任务在 Set up job 阶段就失败。改用原生 rustup 命令安装工具链，绕开 action 下载。
      - name: Setup Rust (rustup)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app (debug output)
        id: build
        run: |
          npm run tauri build 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}
          path: build-log.txt

      # 注意：Windows runner 默认用 PowerShell，bash 语法需显式 shell: bash
      - name: Verify bundle exists (debug)
        if: success()
        shell: bash
        run: |
          echo "=== bundles ==="
          ls -la src-tauri/target/release/bundle/ 2>/dev/null || echo "无 bundle 目录"
          ls -la src-tauri/target/release/bundle/nsis/ 2>/dev/null || echo "无 nsis"
          ls -la src-tauri/target/release/bundle/msi/ 2>/dev/null || echo "无 msi"
          ls -la src-tauri/target/release/bundle/macos/ 2>/dev/null || echo "无 macos"
          ls -la src-tauri/target/release/bundle/dmg/ 2>/dev/null || echo "无 dmg"

      - name: Ensure macOS dmg exists
        if: matrix.platform == 'macos-latest' && success()
        shell: bash
        run: test -n "$(ls src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null)" && echo "OK macOS 产物存在"

      - name: Ensure Windows exe exists
        if: matrix.platform == 'windows-latest' && success()
        shell: bash
        run: test -n "$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null)" && echo "OK Windows 产物存在"

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: pixcat-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: pixcat-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi